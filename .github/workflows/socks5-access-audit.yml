name: SOCKS5 audit and UDP regression
on:
  push:
    branches:
      - main
      - feature/socks5-access-audit
      - feature/socks5-udp
    paths:
      - .github/workflows/socks5-access-audit.yml
      - .gitattributes
      - README.md
      - socks5.py
      - socks5-traffic.py
      - socks5-audit.py
      - socks5-install.sh
      - tests/test_socks5_*.py
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/socks5-access-audit.yml
      - .gitattributes
      - README.md
      - socks5.py
      - socks5-traffic.py
      - socks5-audit.py
      - socks5-install.sh
      - tests/test_socks5_*.py
  workflow_dispatch:
jobs:
  offline-audit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check syntax and four-part audit behavior
        run: |
          sha256sum socks5.py socks5-traffic.py socks5-audit.py
          python3 -m py_compile socks5.py socks5-traffic.py socks5-audit.py
          bash -n socks5-install.sh
          python3 -m unittest discover -s tests -p test_socks5_access_audit.py -v
      - name: Check UDP ownership, guards and daily traffic
        run: |
          python3 -m unittest discover -s tests -p test_socks5_udp_core.py -v
          python3 -m unittest discover -s tests -p test_socks5_udp_traffic.py -v
      - name: Offline CI does not replace host acceptance
        run: |
          echo 'Offline CI succeeded or failed independently of required real-host tests.'
          echo 'Production installation still requires host-level safety checks and snapshots.'
